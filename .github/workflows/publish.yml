
name: SPORT LAB - Publicacion automatica

on:
  schedule:
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: sport-lab-publicacion
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ejecutar SPORT LAB
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_articles.py

      - name: Sincronizar y guardar publicaciones
        run: |
          git config user.name "SPORT LAB Bot"
          git config user.email "actions@github.com"

          git add data/articles.json

          if ! git diff --cached --quiet; then
            git commit -m "Actualizacion SPORT LAB"
          fi

          git pull --rebase origin main
          git push origin HEAD:main

      - name: Preparar web para publicar
        run: |
          mkdir -p _site/data
          cp index.html _site/index.html
          cp data/articles.json _site/data/articles.json

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos de la web
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      # GitHub puede tardar unos segundos en hacer visible el artefacto
      # de Pages en su API después de terminar la subida.
      - name: Esperar a que GitHub registre el artefacto
        run: sleep 20

      - name: Publicar SPORT LAB
        id: deployment
        uses: actions/deploy-pages@v4
