name: SPORT LAB - Publicación automática

on:
  schedule:
    - cron: '0 7 * * 1,3,5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Instalar dependencias
        run: pip install requests

      - name: Ejecutar SPORT LAB
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python scripts/fetch_articles.py

      - name: Guardar publicaciones
        run: |
          git config user.name "SPORT LAB Bot"
          git config user.email "actions@github.com"
          git add data/articles.json
          git diff --cached --quiet || git commit -m "SPORT LAB: actualización científica"
          git push
